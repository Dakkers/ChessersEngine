name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ChessersEngine.Cli/schemas/package-lock.json

      - name: Restore
        run: dotnet restore ChessersEngine.sln

      - name: Build
        run: dotnet build ChessersEngine.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ChessersEngine.sln --configuration Release --no-build --verbosity normal

      - name: Oracle & codec schema checks
        run: |
          out="$(mktemp -d)"
          dotnet run --project ChessersEngine.Cli --configuration Release --no-restore --no-build -- \
            --ai-vs-ai --games 1 --seed 1 --quiet --max-plies 6 --out "$out"
          dotnet run --project ChessersEngine.Cli --configuration Release --no-restore --no-build -- \
            --scenario Checkmate1 --ai-vs-ai --seed 1 --quiet --out "$out"
          dotnet run --project ChessersEngine.Cli --configuration Release --no-restore --no-build -- \
            --dump-codec --out "$out"
          cd ChessersEngine.Cli/schemas
          npm ci
          npx tsx check-oracle.ts . "$out"/chessers-*.json "$out"/scenario-*.json
          npx tsx check-codec.ts . "$out"/codec.v1.json
