name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ChessersEngine.Cli/schemas/.nvmrc
          cache: pnpm
          cache-dependency-path: ChessersEngine.Cli/schemas/pnpm-lock.yaml

      - name: Restore
        run: dotnet restore ChessersEngine.sln

      - name: Build
        run: dotnet build ChessersEngine.sln --configuration Release --no-restore

      - name: Oracle, codec, perf & workloads schema checks
        run: |
          out="$(mktemp -d)"
          dotnet run --project ChessersEngine.Cli --configuration Release --no-restore --no-build -- \
            --ai-vs-ai --games 1 --seed 1 --quiet --max-plies 6 --out "$out"
          dotnet run --project ChessersEngine.Cli --configuration Release --no-restore --no-build -- \
            --scenario Checkmate1 --ai-vs-ai --seed 1 --quiet --out "$out"
          dotnet run --project ChessersEngine.Cli --configuration Release --no-restore --no-build -- \
            --dump-codec --out "$out"
          # --smoke runs every workload once: this checks that the bench is wired, not that it is fast.
          # Shared runners are far too noisy to gate on timings, so nothing here compares them.
          dotnet run --project ChessersEngine.Bench --configuration Release --no-restore --no-build -- \
            --smoke --out "$out"
          cd ChessersEngine.Cli/schemas
          pnpm install --frozen-lockfile
          # The workload manifest is a checked-in source file, not an emitted artifact.
          node check-workloads.ts ../../ChessersEngine.Bench/workloads.v1.json
          node check-oracle.ts . "$out"/chessers-*.json "$out"/scenario-*.json
          node check-codec.ts . "$out"/codec.v1.json
          node check-perf.ts . "$out"/perf.v1.json

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: unit
            filter: FullyQualifiedName!~ChessersEngine.Tests.FuzzTests
          - name: fuzz-random
            filter: FullyQualifiedName~ChessersEngine.Tests.FuzzTests.RandomLegalGames
          - name: fuzz-ai
            filter: FullyQualifiedName~ChessersEngine.Tests.FuzzTests.AiGames
          - name: fuzz-determinism
            filter: FullyQualifiedName~ChessersEngine.Tests.FuzzTests.SameSeed
    name: test (${{ matrix.shard.name }})
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test ChessersEngine.Tests --configuration Release --filter "${{ matrix.shard.filter }}" --verbosity normal
