name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ChessersEngine.sln

      - name: Build
        run: dotnet build ChessersEngine.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ChessersEngine.sln --configuration Release --no-build --verbosity normal
