name: quality check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChessersEngine.Cli/schemas
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ChessersEngine.Cli/schemas/.nvmrc
          cache: pnpm
          cache-dependency-path: ChessersEngine.Cli/schemas/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run fmt:check

      - name: Lint check
        run: pnpm run lint:check

      - name: Typecheck
        run: pnpm run typecheck
